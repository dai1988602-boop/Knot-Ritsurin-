[project]
name = "knot-ritsurin"
version = "0.1.0"
description = "Knot Ritsurin 民泊自動化運営スクリプト群 (Beds24 / PriceLabs 連携)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
